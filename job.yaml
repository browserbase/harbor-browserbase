# Custom environment, agent, and verifier implementations belong in this job-level
# config because task.toml cannot wire their import paths.
# Harbor scrubs the BROWSERBASE_API_KEY value from agent output, including when
# that literal is embedded in a signed connect URL. BROWSERBASE_PROJECT_ID does
# not match its sensitive-key regex and survives in jobs output; stripping that
# identifier before sharing is an operator responsibility and a known gap.
job_name: browserbase-smoke-suite
jobs_dir: jobs
# Each trial holds one real Browserbase session, so concurrency is bounded by the
# Browserbase plan's concurrent-session limit, not local CPU.
n_concurrent_trials: 3

# Harbor validates each child with Task.is_valid_dir; incomplete fixtures are
# silently skipped, so confirm that the run output reports 10 discovered tasks.
datasets:
  - path: tasks

environment:
  import_path: bb_harbor.env:BrowserbaseEnvironment
  kwargs:
    # Canonical Stagehand must own the session; true would create an inert second
    # session unless Stagehand is patched to forward browserbaseSessionID to initV3.
    create_session: false
    delete_on_start_failure: true

agents:
  - import_path: bb_harbor.agent:StagehandAgent
    model_name: google/gemini-3-flash-preview
    kwargs:
      mode: dom
    env:
      BROWSERBASE_API_KEY: ${BROWSERBASE_API_KEY}
      BROWSERBASE_PROJECT_ID: ${BROWSERBASE_PROJECT_ID}
      GEMINI_API_KEY: ${GEMINI_API_KEY}

verifier:
  import_path: bb_harbor.verifier:StagehandVerifier
  env:
    GEMINI_API_KEY: ${GEMINI_API_KEY}
  kwargs:
    judge_model: google/gemini-3-flash-preview
